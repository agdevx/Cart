name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ "${{ github.ref_name }}" = "main" ]; then
            BACKEND_TAGS="agdevx/cart-backend:latest,agdevx/cart-backend:${SHORT_SHA}"
            FRONTEND_TAGS="agdevx/cart-frontend:latest,agdevx/cart-frontend:${SHORT_SHA}"
          else
            BACKEND_TAGS="agdevx/cart-backend:preview-${SHORT_SHA}"
            FRONTEND_TAGS="agdevx/cart-frontend:preview-${SHORT_SHA}"
          fi
          echo "backend=${BACKEND_TAGS}" >> $GITHUB_OUTPUT
          echo "frontend=${FRONTEND_TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.tags.outputs.backend }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.tags.outputs.frontend }}
